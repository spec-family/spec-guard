name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository; the SARIF upload asks for what it
# needs on its own job. Stated rather than inherited, because the default is
# whatever the repository setting happens to be.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Headroom for a bad runner, not a budget: the slowest leg, Windows, took
    # under a minute and a half. A job that hangs stops here rather than at
    # GitHub's six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor package.json promises, 24 the active LTS, 26 the
        # current release and the next LTS: a break there is news before it is
        # an incident.
        # Each image by the label that is its alone, never `-latest`, which
        # GitHub moves (tests/runner-images.test.ts). Windows and macOS are what
        # their `-latest` gave on 2026-10-07. Both Ubuntu images, because
        # `ubuntu-latest` hands a user's job either from 2026-10-19 and the
        # suite runs the image's bash. spec-core's ADR-0008 has the steps
        # that move one.
        os: [ubuntu-24.04, ubuntu-26.04, windows-2025-vs2026, macos-26]
        node: ['22', '24', '26']
        # A pull request runs three of the twelve legs: the floor and the current
        # release on the gates' image, and the floor on Windows. macOS, whose
        # hosted runners GitHub could not always supply (2026-11-12), runs on
        # main and in releases only. A push
        # to main, a manual run and a release (which calls this workflow) run
        # them all, so every leg still passes before a version is staged.
        # spec-core's ADR-0008, amended 2026-11-12, says why.
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-26.04"},{"node":"24"},{"os":"windows-2025-vs2026","node":"26"},{"os":"macos-26"}]' || '[]') }}

    steps:
      # Pinned to a commit, with the tag beside it, because a tag can be moved
      # and a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here uses git again, and a token left in .git/config is one
          # a later step, or a dependency of one, could read.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # No dependency's install script runs: the tree needs none, npm 12 runs
      # none unless package.json allows the package, and the flag has npm 10 and
      # 11 run none either (tests/npm.test.ts).
      - run: npm ci --ignore-scripts

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # spec-guard executes its own ADRs. If the code drifts from the
      # documentation, this step fails with the line number of the claim. Which
      # specs is package.json's to say (ADR-0014), so this step, the selfcheck
      # script and an agent's MCP server all read the same ones.
      - name: Execute this repository's own specs
        run: node ./bin/spec-guard.js --verbose

      # A rule that passes is only worth something if it can fail. This shows
      # each one a violation of itself, in memory, and fails on any that still
      # pass with it in place (ADR-0016). It runs the rules as the step above
      # does: --strict would also fail every import rule over src on the one
      # require() in cli.ts that no rule can resolve.
      - name: Prove every rule in those specs can fail
        run: node ./bin/spec-guard.js prove

      # Every ADR a comment in this repository cites has to exist and be in
      # force (ADR-0017). The family is read off the ADRs' own titles.
      - name: Check the ADRs the code's comments cite
        run: node ./bin/spec-guard.js cites

  # Dogfooding the SARIF output: this is the surface that puts a broken
  # architecture rule on the offending line of a pull request, so it should be
  # exercised by the project that ships it rather than only by its tests.
  # On one image, as coverage, the sweep and the release are: the one their
  # numbers were measured on. Moving one is spec-core's ADR-0008.
  scan:
    name: code scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # the SARIF upload

    steps:
      # Without the token in .git/config, `npm ci` and the build cannot reach
      # the upload's write access; only the upload step is handed it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      # `|| true` because the point of this job is the upload. A failing
      # assertion is already a red tick on the test job above; here it is input.
      - name: Produce a SARIF report
        run: node ./bin/spec-guard.js --format sarif > spec-guard.sarif || true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        # A pull request from a fork gets a read-only token, so the upload would
        # fail for a reason that has nothing to do with the code.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        continue-on-error: true
        with:
          sarif_file: spec-guard.sarif
          category: spec-guard

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # One check that every job above passed, for the main ruleset to require:
  # a required check for each leg would name legs a pull request does not
  # run. A job that failed or was cancelled fails it; one skipped because
  # another failed shows that other's failure here too (spec-core's ADR-0008, amended 2026-11-12).
  all-green:
    name: all green
    if: ${{ always() }}
    needs: [test, scan, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "a job ended $result"; exit 1 ;;
            esac
          done
